name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,service,llm]"
      - name: Format check
        run: ruff format --check billing_support tests scripts
      - name: Lint
        run: ruff check billing_support tests scripts
      - name: Type check (strict)
        run: mypy
      - name: Test
        run: pytest -q
      - name: Leak-gate
        run: python scripts/leakgate.py .

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Regenerate eval snapshot + schema
        run: |
          billing-support eval --out results/demo
          billing-support schema --out schema/run-report-v1.json
      - name: Committed snapshot must match a fresh run
        run: git diff --exit-code -- results/demo schema/run-report-v1.json
      - name: Validate snapshot against schema
        run: >
          npx --yes ajv-cli@5 validate --spec=draft2020
          -s schema/run-report-v1.json
          -d results/demo/eval-report.json

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Rebuild dashboard data from the snapshot
        run: |
          billing-support eval --out results/demo
          python scripts/build_dashboard_data.py
      - name: Dashboard data must be in sync
        run: git diff --exit-code -- dashboard/report-data.js
      - name: Python and browser workflow parity
        run: python scripts/check_js_parity.py
      - name: Dashboard event regressions
        run: node scripts/check_dashboard_ui.js
